name: iOS build

on:
  workflow_dispatch:
  pull_request:
  push:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test shared domain
        run: ./gradlew :core:domain:jvmTest

      - name: Build iOS simulator app
        run: >-
          xcodebuild
          -project iosApp/Look4Sat.xcodeproj
          -scheme Look4Sat
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/ios
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Upload simulator app
        uses: actions/upload-artifact@v5
        with:
          name: Look4Sat-iOS-Simulator
          path: build/ios/Build/Products/Debug-iphonesimulator/Look4Sat.app
          if-no-files-found: error
